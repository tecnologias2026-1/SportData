<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SportData - Carrito de Compras. Tu tienda deportiva de confianza. Encuentra los mejores productos deportivos al mejor precio.">
    <title>Comparar - SportData</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body class="secondary-page">
    <header id="site-header" data-scope="html" data-active="cart"></header>
    <script src="../js/navbar.js"></script>

    <main class="main-content">
        <section class="empty-cart" aria-labelledby="empty-cart-title">
            <!-- Empty Cart Icon -->
            <div class="empty-cart__icon" aria-hidden="true">
                <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </div>

            <!-- Empty State Message -->
            <div class="empty-cart__content">
                <h1 id="empty-cart-title" class="empty-cart__title">Tu carrito está vacío</h1>
                <p class="empty-cart__description">Agrega productos para comenzar tu compra</p>
                <a href="catalog.html" class="empty-cart__button">Ir al catálogo</a>
            </div>
        </section>
    </main>

    <footer id="site-footer" data-scope="html"></footer>
    <script src="../js/footer.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
